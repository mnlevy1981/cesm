on:
  push:
    branches: [ master, cesm3.0-alphabranch, add_preview_namelist_CI ]
  pull_request:
    branches: [ master, cesm3.0-alphabranch ]
jobs:
  preview_namelists:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Lots of python versions, pare down if we don't support a version
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create new case, run case.setup, and then preview namelists
        run: |
          sudo apt-get install xmllint
          $GITHUB_WORKSPACE/bin/git-fleximod update
          cd $GITHUB_WORKSPACE/cime/scripts
          ./create_newcase --run-unsupported --compset BLT1850 --res ne30pg3_t232 --case $GITHUB_WORKSPACE/cases/BLT1850_${{ matrix.python-version }}
          cd $GITHUB_WORKSPACE/cases/BLT1850_${{ matrix.python-version }}
          ./case.setup
          ./preview_namelists
          cd $GITHUB_WORKSPACE/cime/scripts
          ./create_newcase --run-unsupported --compset C_JRA --res TL319_t232 --case $GITHUB_WORKSPACE/cases/C_JRA_${{ matrix.python-version }}
          cd $GITHUB_WORKSPACE/cases/C_JRA_${{ matrix.python-version }}
          ./case.setup
          ./preview_namelists
          cd $GITHUB_WORKSPACE/cime/scripts
          ./create_newcase --run-unsupported --compset G_JRA --res TL319_t232 --case $GITHUB_WORKSPACE/cases/G_JRA_${{ matrix.python-version }}
          cd $GITHUB_WORKSPACE/cases/G_JRA_${{ matrix.python-version }}
          ./case.setup
          ./preview_namelists
